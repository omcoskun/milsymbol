name: Test

# main is tested by the deploy workflow (pages.yml); this covers the work
# before it gets there.
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test symbol rendering
        run: npx --no-install tead

      - name: Lint library, tests, and Studio
        run: npm run lint

      - name: Build public site with license notices
        run: npm run studio:build:public

      - name: Test package exports and build helpers
        run: npm run test:node
